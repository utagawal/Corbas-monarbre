{% extends "admin/base.html" %}
{% block title %}Mon mot de passe{% endblock %}
{% block body %}
<h1>Mon mot de passe</h1>
<div class="panel" style="max-width:480px">
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
 <label for="ancien">Mot de passe actuel</label><input type="password" id="ancien" name="ancien" autocomplete="current-password" required>
 <label for="nouveau">Nouveau mot de passe <span class="aide">10 caractères minimum.</span></label><input type="password" id="nouveau" name="nouveau" minlength="10" autocomplete="new-password" required>
 <label for="confirmation">Confirmez le nouveau mot de passe</label><input type="password" id="confirmation" name="confirmation" minlength="10" autocomplete="new-password" required>
 <p><button>Changer mon mot de passe</button></p></form></div>
{% endblock %}
