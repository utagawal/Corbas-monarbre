# Mon arbre à Corbas (bêta) : application Docker sur 127.0.0.1:8010, servie sous https://maps.utagawavtt.com/monarbre/
#
# Installation sur le serveur (depuis le dossier du projet) :
#     sudo cp deploy/nginx/MonArbre.conf /etc/nginx/snippets/MonArbre.conf
# puis, dans le bloc « server { listen 443 … } » de /etc/nginx/sites-available/maps.utagawavtt.com :
#     include /etc/nginx/snippets/MonArbre.conf;
# puis : sudo nginx -t && sudo systemctl reload nginx
# (après une mise à jour du dépôt, recopier le fichier avec la même commande cp, puis tester et recharger)
#
# Même méthode que ATCorbas.conf (Cloudflare, headers-more, cache tuiles du serveur) :
#  - « ^~ » : les locations regex du serveur (\.json$, \.geojson$, tuiles…) ne doivent pas capter les URL de l'application ;
#  - aucun proxy_cache ici : pages avec données personnelles, jamais en cache ;
#  - add_header : le formulaire est intégré en iframe sur corbas.fr, c'est la directive CSP frame-ancestors de l'application
#    (FRAME_ANCESTORS) qui décide, et l'application pose elle-même ses en-têtes de sécurité (nosniff, HSTS, Referrer-Policy,
#    X-Frame-Options: DENY sur l'administration). Or nginx.conf déclare au niveau http « add_header X-Frame-Options SAMEORIGIN »
#    et nosniff : ces en-têtes sont ajoutés après headers-more, donc more_clear_headers ne peut pas les retirer (et ferait
#    sauter le DENY de l'application). Règle nginx : dès qu'un location déclare un add_header, il n'hérite plus d'aucun
#    add_header des niveaux supérieurs. Le add_header X-Robots-Tag ci-dessous (utile pour la bêta) coupe donc cet héritage ;
#    ne pas le supprimer sans en garder un autre ;
#  - more_clear_headers : filet de sécurité contre un CORS « * » posé par un more_set_headers du bloc server ;
#  - proxy_intercept_errors off : l'application renvoie ses propres pages d'erreur.
# Prérequis côté application : URL_PREFIX=/monarbre dans .env (le cookie de session porte alors déjà le chemin /monarbre,
# aucun proxy_cookie_path n'est nécessaire), port publié en local seulement : 127.0.0.1:8010:8000.

location = /monarbre {
    return 301 /monarbre/;
}

location ^~ /monarbre/ {
    # Le « / » final retire le préfixe /monarbre avant de transmettre à l'application.
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # IP réelle restaurée par le snippet Cloudflare (limitation des envois par visiteur)
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 6m;                         # photos envoyées depuis l'administration : 5 Mo maximum

    proxy_intercept_errors off;

    more_clear_headers "Access-Control-Allow-Origin" "Access-Control-Allow-Methods" "Access-Control-Allow-Headers" "Access-Control-Max-Age";

    # Bêta : pas de référencement par les moteurs de recherche (à remplacer à la mise en service, par exemple par
    # « add_header Referrer-Policy "same-origin" always; » : il faut garder au moins un add_header, voir plus haut).
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
