services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"   # derrière Caddy ou nginx : adresse IP réelle des visiteurs pour la limitation des envois
    volumes:
      - parrainage-data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAINE: ${DOMAINE:-parrainage.example.fr}   # lu dans .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
volumes:
  parrainage-data:
  caddy-data:
